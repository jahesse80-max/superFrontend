<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <h1>Vue.js Pet Depot</h1>

<div id="app">

    <figure>
        <img v-bind:src="product.image" width= 300>
    </figure>
     
    <h2 v-text=" product.title"></h2>
    <p v-text=" product.description"></p>
    <p>Price: £{{product.price}}</p>
</div>


<script type="module">
    const {createApp} = Vue
    const petstore = createApp({
        data(){
            return{
                sitename: "Vue.js Pet Depot",
                product: {
                    id: 1001,
                    title: "Cat Food, 25lb bag",
                    description: "A 25 pound bag of irresistible organic goodness for your cat.",
                    price: 20.99,
                    image: "catFood.jpg"
                }
            }
        }
    })
    petstore.mount('#app');
</script>

<div id="divbasket">
         
         <p>You have {{addtoBasket}} items in your basket and (???) items in total. </p>

         <button v-on:click="addToBasket()">Add to Basket</button>

         <button v-bind:disabled="true"> Get more items</button>
    </div>

      <script type="module">
        const {createApp} = Vue
        const myApp1 = createApp({  //createsa new app instance
            data(){
                return{
                    firstName:"Ichigo",
                    lastName: "Kurosaki",
                    addtoBasket: 0,
                }
            },
            computed:{
                fullName:function(){   // function returns the name of the user
                    return this.firstName + " " + this.lastName;
                },
            },
            methods: {
                addToBasket() { // function adds 1 to the basket eaach time
                    this.addtoBasket = this.addtoBasket + 1;
                }
            }
        });
        myApp1.mount("#divbasket")
    </script> 
</body>
</html>
